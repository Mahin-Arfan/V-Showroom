<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V-Showroom · Baby Shoes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Nunito:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1f2a44; --accent:#f2b632; --glass:rgba(255,255,255,.52); }
  html,body { margin:0; height:100%; overflow:hidden; background:#dce8f2; font-family:Nunito,system-ui,sans-serif; color:var(--ink); }
  canvas { display:block; width:100%; height:100%; touch-action:none; }
  #hint { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); padding:8px 16px; border-radius:999px;
    background:var(--glass); backdrop-filter:blur(14px); border:1px solid rgba(255,255,255,.7); font-size:14px; }
  #panel { position:fixed; top:50%; right:24px; width:min(320px,calc(100vw - 48px)); transform:translate(24px,-50%); opacity:0; pointer-events:none;
    padding:24px; border-radius:24px; background:var(--glass); backdrop-filter:blur(18px) saturate(140%);
    -webkit-backdrop-filter:blur(18px) saturate(140%); border:1px solid rgba(255,255,255,.75); box-shadow:0 12px 40px rgba(31,42,68,.18);
    transition:opacity .25s, transform .25s; }
  #panel.open { opacity:1; transform:translate(0,-50%); pointer-events:auto; }
  #panel h1 { margin:0 0 4px; font:800 28px/1.1 "Bricolage Grotesque",sans-serif; }
  #price { font-size:20px; font-weight:700; margin-bottom:16px; }
  .sizes { display:flex; gap:8px; flex-wrap:wrap; margin:6px 0 20px; }
  .sizes span { min-width:36px; padding:6px 10px; text-align:center; border-radius:12px; background:rgba(255,255,255,.6); border:1px solid rgba(31,42,68,.15); font-weight:700; }
  button { font:inherit; font-weight:700; cursor:pointer; border:0; border-radius:14px; padding:12px 18px; }
  #order { width:100%; background:var(--accent); color:var(--ink); }
  #back { background:transparent; color:var(--ink); padding:0 0 14px; }
  button:focus-visible { outline:3px solid var(--ink); outline-offset:2px; }
  #filters { position:fixed; top:20px; left:20px; display:flex; gap:8px; flex-wrap:wrap; max-width:calc(100vw - 40px); padding:10px; border-radius:20px;
    background:var(--glass); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border:1px solid rgba(255,255,255,.7); }
  #filters button, #feet { background:rgba(255,255,255,.6); color:var(--ink); border:1px solid rgba(31,42,68,.15); padding:8px 14px; }
  #filters button.on { background:var(--ink); color:#fff; }
  #feet { width:100%; margin-bottom:10px; }
  body.inspecting #filters { display:none; }
  #fade { position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; transition:opacity .2s; }
  #fade.on { opacity:1; }
  @media (prefers-reduced-motion:reduce) { #panel { transition:none; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<nav id="filters" aria-label="Filter by size"></nav>
<div id="fade"></div>
<div id="hint">Drag to look · WASD to walk · Click a shoe to inspect</div>
<aside id="panel" aria-live="polite">
  <button id="back">Back to showroom</button>
  <h1 id="name"></h1>
  <div id="price"></div>
  <div>Available sizes</div>
  <div class="sizes" id="sizes"></div>
  <button id="feet">Feet view</button>
  <button id="order">Order on brand site</button>
</aside>
<script type="module" src="/src/main.js"></script>
</body>
</html>
